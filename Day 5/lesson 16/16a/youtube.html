<html>
    <head>
        <link rel="stylesheet" href="header.css" />
    </head>

    <body>
        <div class="header">
            <div class="left-section">
                <div class="hamburger-menu">☰</div>

                <div class="youtube-logo">
                    <span class="youtube-icon">▶</span>
                    <span class="youtube-text">YouTube</span>
                </div>
            </div>

            <div class="middle-section">
                <input class="search-bar" type="text" placeholder="Search" />

                <button class="search-button">🔍
                    <div class="tooltip">Search</div>
                </button>

                <button class="voice-search-button">🎤
                    <div class="tooltip">Search with your voice</div>
                </button>
            </div>

            <div class="right-section">
                <div class="upload-icon-container">
                    <span class="upload-icon">➕</span>
                    <div class="tooltip">Create</div>
                </div>

                <div class="youtube-apps-icon-container">
                    <span class="youtube-apps-icon">▦</span>
                    <div class="tooltip">YouTube Apps</div>
                </div>

                <div class="notifications-icon-container">
                    <span class="notifications-icon">🔔</span>
                    <div class="notifications-count">3</div>
                    <div class="tooltip">Notifications</div>
                </div>

                <img class="current-user-picture" src="thumbnails/thumbnail-1.webp" alt="User profile"/>
            </div>
        </div>

        <div class="video-grid">
            <div class="video-preview">
                <img class="thumbnail" src="thumbnails/thumbnail-1.webp" alt="Video thumbnail"/>

                <p class="video-title">Talking Tech and AI with Google CEO Sundar Pichai!</p>

                <p class="video-author">Marques Brownlee</p>

                <p class="video-stats">3.4M views · 6 months ago</p>
            </div>

            <div class="video-preview">
                <img class="thumbnail" src="thumbnails/thumbnail-2.webp" alt="Video thumbnail"/>

                <p class="video-title">Try Not To Laugh Challenge #9</p>

                <p class="video-author">Markiplier</p>

                <p class="video-stats">19M views · 4 years ago</p>
            </div>
        </div>
    </body>
</html>
