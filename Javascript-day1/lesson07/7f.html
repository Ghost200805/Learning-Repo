<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      function convertToFahrenheit(celsius) {
        return (celsius * 9) / 5 + 32;
      }

      function convertToCelsius(fahrenheit) {
        return ((fahrenheit - 32) * 5) / 9;
      }

      function convertTemperature(degrees, unit) {
        if (unit === "C") {
          const result = convertToFahrenheit(degrees);
          return `${result}F`;
        } else if (unit === "F") {
          const result = convertToCelsius(degrees);
          return `${result}C`;
        }
      }
      const celsius = convertTemperature(25, "C");
      const fahrenheit = convertTemperature(86, "F");

      console.log("In",celsius);
      console.log("In",fahrenheit);
    </script>
  </body>
</html>
