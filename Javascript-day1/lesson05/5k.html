<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cart</title>
  </head>

  <body>
    <button onclick="showQuantity()">Show Quantity</button>

    <button
      onclick="
        cartQuantity++;
        showQuantity();
      "
    >
      Add to Cart
    </button>

    <button
      onclick="
        cartQuantity += 2;
        showQuantity();
      "
    >
      +2
    </button>

    <button
      onclick="
        cartQuantity += 3;
        showQuantity();
      "
    >
      +3
    </button>

    <button
      onclick="
        cartQuantity += 4;
        showQuantity();
      "
    >
      +4
    </button>

    <button
      onclick="
        cartQuantity += 5;
        showQuantity();
      "
    >
      +5
    </button>

    <button
      onclick="
        cartQuantity--;
        showQuantity();
      "
    >
      Remove from cart
    </button>

    <button
      onclick="
        cartQuantity -= 2;
        showQuantity();
      "
    >
      -2
    </button>

    <button
      onclick="
        cartQuantity -= 3;
        showQuantity();
      "
    >
      -3
    </button>

    <button
      onclick="
        cartQuantity = 0;
        console.log('Cart was reset.');
        showQuantity();
      "
    >
      Reset Cart
    </button>

    <script>
      let cartQuantity = 0;

      function showQuantity() {
        if (cartQuantity < 0) {
          console.log("No cart items");
        } else {
          console.log(`Cart quantity: ${cartQuantity}`);
        }
      }
    </script>
  </body>
</html>
