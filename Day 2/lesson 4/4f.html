<html>
    <style>
        a {
            color: rgb(0, 113, 133);
        }
        .text1 {
            font-weight: bold;
            font-size: 30px;
        }
        .text2 {
            color: rgb(0, 118, 0);
            font-weight: bold;
        }
        .add-btn {
            background-color: rgb(255, 216, 20);
            border-radius: 20px;
            padding: 12px 50px;
            color: black;
            border: none;
            cursor: pointer;
            margin-right: 15px;
            transition: background-color 0.15s;
        }
        .add-btn:hover {
            background-color: rgb(240, 200, 10);
        }
        .buy-btn {
            background-color: rgb(255, 164, 28);
            border-radius: 20px;
            padding: 12px 50px;
            color: black;
            border: none;
            cursor: pointer;
            transition: background-color 0.15s;
        }
        .buy-btn:hover {
            background-color: rgb(230, 140, 20);
        }
    </style>

    <body>
        <a href="http://www.amazon.in" target="_blank">
            Back to Amazon
        </a>

        <p class="text1">Nike Black Running Shoes</p>

        <p class="text2">$39 - in stock.</p>

        <p>Free delivery tomorrow.</p>

        <button class="add-btn">Add to Cart</button>

        <button class="buy-btn">Buy now</button>

    </body>
</html>
