<html>
    <style>
        .sub-btn {
            background-color: rgb(204, 0, 0);
            border-radius: 2px;
            border: none;
            padding: 12px 30px;
            color: white;
            cursor: pointer;
        }
        .join-btn {
            background-color: white;
            border-radius: 2px;
            cursor: pointer;
            padding: 12px 30px;
            color: rgb(0, 100, 200);
            border: solid 1px rgb(0, 100, 200);
        }
        .tweet-btn {
            background-color: rgb(30, 144, 255);
            border-radius: 25px;
            padding: 12px 30px;
            color: white;
            border: none;
            cursor: pointer;
        }
    </style>

    <body>
        <button class="sub-btn">SUBSCRIBE</button>
        <button class="join-btn">JOIN</button>
        <button class="tweet-btn">Tweet</button>
    </body>
</html>
