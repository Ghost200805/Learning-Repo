<html>
    <style>
        .apply {
            background-color: rgb(10, 102, 194);
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 13px;
            font-weight: bold;
            cursor: pointer;
        }

        .save {
            background-color: white;
            color: rgb(10, 102, 194);
            padding: 12px 30px;
            border: solid 1px rgb(10, 102, 194);
            border-radius: 13px;
            cursor: pointer;
            transition: border-width 0.15s;
        }

        .save:hover {
            border-width: 2px;
        }
    </style>

    <body>
        <button class="apply">Apply on company website</button>
        <button class="save">Save</button>
    </body>
</html>
