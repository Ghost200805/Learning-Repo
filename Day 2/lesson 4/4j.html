<html>
    <style>
      .shadow-btn {
        background-color: green;
        color: white;
        border: none;
        font-size: 15px;
        padding: 10px 18px;
        cursor: pointer;
        box-shadow: 5px 5px 8px rgba(0, 0, 0, 0.4);
        transition: all 0.3s;
      }

      .shadow-btn:active {
        margin: 7px 0px 0px 7px;
        box-shadow: none;
      }
    </style>
    <body>
        <button class="shadow-btn">Shadow</button>
    </body>
</html>
