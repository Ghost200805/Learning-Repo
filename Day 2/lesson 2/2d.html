<html>
    <style>
        .start-button{
            background-color: rgb(121,82,179);
            color: rgb(255,255,255);
            border: none;
            height: 40px;
            width: 100px;
            border-radius: 2px;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            margin-left: 8px;
        }
        .download-button{
            background-color: rgb(255,255,255);
            color: rgb(108,117,125);
            border: solid 1px;
            height: 40px;
            width: 100px;
            border-radius: 2px;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            margin-left: 8px;
        }
    </style>
    <body>
        <button class="start-button">Get Started</button>
        <button class="download-button">Download</button>
    </body>
</html>
