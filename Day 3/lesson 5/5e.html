<html>
    <style>
        .center {
            align-items: center;
            text-align: center;
        }
        p {
            font-family: Arial;
            text-align: center;
            margin-top: 0;
            margin-bottom: 0;
        }
  
        .new {
            font-size: 20px;
            color: rgb(245, 99, 0);
            margin-bottom: 10px;
        }
  
        .product {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 1px;
            margin-top: 1px;
        }
  
        .title {
            font-size: 60px;
            font-weight: bold;
            margin-bottom: 15px;
        }
  
        .price {
            font-size: 25px;
            margin-bottom: 25px;
            margin-top: 1px;
        }
  
        button {
            background-color: rgb(0, 113, 227);
            color: white;
            padding: 10px 18px;
            border: none;
            border-radius: 30px;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
    <body>
        <div class="center">
            <p class="new">New</p>
            <p class="product">MacBook Pro</p>
            <p class="title">Supercharged for pros.</p>
            <p class="price">From $1999</p>
            <button>Buy</button>
        </div>
    </body>
</html>
