<html>
    <style>
        p {
            font-family: Arial;
            margin-top: 0px;
            margin-bottom: 0px;
        }

        .price {
            font-size: 31px;
            margin-bottom: 7px;
        }

        .currency {
            font-size: 17px;
            color: rgb(100, 100, 100);
        }

        .change {
            color: rgb(24, 128, 56);
            margin-bottom: 7px;
        }

        .hours {
            color: rgb(100, 100, 100);
        }

        .hours-change {
            color: rgb(235, 39, 39);
            padding-left: 3px;
        }
    </style>
    <body>
        <p class="price">1,049.61 <span class="currency">USD</span></p>
        <p class="change">+18.05 (1.75%) today</p>
        <p class="hours">After hours 1,048.00
        <span class="hours-change">-1.61 (0.15%)</span>
        </p>
    </body>
</html>
